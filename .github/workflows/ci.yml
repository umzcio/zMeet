name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    # The package's platform floor is macOS 26 (see Package.swift), so both
    # testing and building require a macOS 26 runner/toolchain.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: .build-ci
          key: spm-${{ runner.os }}-26-${{ hashFiles('Package.resolved') }}
      - name: Enforce ZMeetCore import allowlist
        run: |
          bad=$(grep -rhE '^import ' Sources/ZMeetCore --include='*.swift' | sort -u | grep -vE '^import (Foundation|SQLite3|CSpeexDSP)$' || true)
          if [ -n "$bad" ]; then echo "Disallowed imports in ZMeetCore:"; echo "$bad"; exit 1; fi
      - name: Run ZMeetCore tests
        run: swift test --scratch-path .build-ci
      - name: Build all products (release)
        run: swift build -c release --scratch-path .build-ci
