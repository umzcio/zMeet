name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-build:
    # The package's platform floor is macOS 26 (see Package.swift), so both
    # testing and building require a macOS 26 runner/toolchain.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: .build-ci
          key: spm-${{ runner.os }}-26-${{ hashFiles('Package.resolved') }}
      - name: Run ZMeetCore tests
        run: swift test --scratch-path .build-ci
      - name: Build ZMeetApp (release)
        run: swift build -c release --product ZMeetApp --scratch-path .build-ci
